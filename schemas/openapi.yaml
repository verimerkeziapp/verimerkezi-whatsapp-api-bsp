                  sent: { type: integer }
                  delivered: { type: integer }
                  read: { type: integer }
                  failed: { type: integer }
                  delivery_rate: { type: number }
                  read_rate: { type: number }
                  failure_rate: { type: number }
                  balance: { type: integer }

  /credit/balance:
    get:
      summary: Current credit balance
      tags: [Credit]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  balance: { type: integer }

  /credit/packages:
    get:
      summary: List available credit packages
      tags: [Credit]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  packages:
                    type: array
                    items: { type: object }

  /credit/usage:
    get:
      summary: Credit usage over a window
      tags: [Credit]
      security: [{ BearerAuth: ["reports:read"] }]
      parameters:
        - in: query
          name: days
          schema: { type: integer, default: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  days: { type: integer }
                  usage: { type: array, items: { type: object } }

  /credit/transactions:
    get:
      summary: List credit transactions (cursor pagination)
      tags: [Credit]
      security: [{ BearerAuth: ["reports:read"] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: source
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  transactions:
                    type: array
                    items: { type: object }
                  next_cursor: { type: string, nullable: true }
                  has_more: { type: boolean }
  /media:
    get:
      summary: List your media records (inbound and outbound)
      description: |
        Returns media belonging to the authenticated account, newest first.
        Only your own records are visible.
      tags: [Media]
      security: [{ BearerAuth: ["messages:read"] }, { BearerAuth: ["inbox:read"] }]
      parameters:
        - { name: limit,  in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: integer }, description: Return records with id lower than this }
        - { name: source, in: query, schema: { type: string, enum: [inbound, outbound] } }
        - { name: kind,   in: query, schema: { type: string, enum: [image, video, document, audio, sticker] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  media:
                    type: array
                    items: { $ref: "#/components/schemas/MediaRecord" }
                  paging:
                    type: object
                    properties:
                      limit:       { type: integer }
                      has_more:    { type: boolean }
                      next_cursor: { type: integer, nullable: true }
        '403': { description: insufficient_scope }


    post:
      summary: Upload a file to Meta and get a media_id
      description: >
        Multipart upload. Returns a Meta media_id (valid 30 days) to use as {type}.id in POST /messages.
        Different from GET /media/{media_id}, which downloads inbound media from storage. Counts in the media rate bucket.
      tags: [Media]
      operationId: uploadMedia
      security: [{ BearerAuth: ["messages:send"] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, phone_number_id]
              properties:
                file: { type: string, format: binary }
                phone_number_id: { type: string }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  media_id: { type: string }
                  type: { type: string, enum: [image, video, audio, document, sticker] }
                  mime_type: { type: string }
                  file_size: { type: integer }
                  expires_at: { type: string }
                  mode: { type: string, enum: [live, test] }
        '413': { description: media_too_large }
        '415': { description: media_invalid_format or unsupported_media_type }
        '422': { description: meta_upload_failed }
  /media/{media_id}:
    get:
      summary: Download a media file
      description: |
        Streams the binary file. Use the `media_id` delivered in the
        `data.media.media_id` field of the `message.received` webhook.

        Add `?meta=1` to receive JSON metadata instead of the file.

        Supports `Range` (206 Partial Content) and `ETag` / `If-None-Match` (304).
        Direct HTTP access to the storage path is disabled; this endpoint is the
        only way to read inbound media.

        Rate limit: 60 requests per minute (separate bucket from other endpoints).
      tags: [Media]
      security: [{ BearerAuth: ["messages:read"] }, { BearerAuth: ["inbox:read"] }]
      parameters:
        - { name: media_id, in: path,  required: true, schema: { type: integer } }
        - { name: meta,     in: query, schema: { type: integer, enum: [0, 1] }, description: "1 returns JSON metadata" }
        - name: Range
          in: header
          schema: { type: string }
          example: bytes=0-1048575
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: The file
          headers:
            Content-Type:            { schema: { type: string } }
            Content-Length:          { schema: { type: integer } }
            Content-Disposition:     { schema: { type: string } }
            ETag:                    { schema: { type: string } }
            Accept-Ranges:           { schema: { type: string } }
            X-Content-Type-Options:  { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/json:
              schema:
                type: object
                description: Returned only when meta=1
                properties:
                  ok:    { type: boolean }
                  media: { $ref: "#/components/schemas/MediaRecord" }
        '206': { description: Partial content (Range) }
        '304': { description: Not modified (ETag matched) }
        '400': { description: invalid_media_id }
        '403': { description: insufficient_scope }
        '404': { description: media_not_found or media_file_missing (also returned for another account's media) }
        '416': { description: range_not_satisfiable }
    head:
      summary: Media headers without the body
      description: Returns Content-Length and Content-Type without transferring the file.
      tags: [Media]
      security: [{ BearerAuth: ["messages:read"] }, { BearerAuth: ["inbox:read"] }]
      parameters:
        - { name: media_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Headers only }
        '404': { description: Not found }
  /webhooks/redeliver:
    post:
      summary: Requeue dead-letter webhook deliveries
      tags: [Webhooks]
      operationId: redeliverWebhooks
      security: [{ BearerAuth: ["webhooks:write"] }, { BearerAuth: ["messages:read"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [since]
              properties:
                since: { type: string, description: "ISO 8601, up to 7 days back" }
      responses:
        '202': { description: Requeued }
        '422': { description: invalid_since }

  /webhooks:
    get:
      summary: List webhook subscriptions
      tags: [Webhooks]
      operationId: listWebhooks
      security: [{ BearerAuth: ["webhooks:read"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookSubscription" }
    post:
      summary: Create a webhook subscription (secret returned once)
      tags: [Webhooks]
      operationId: createWebhook
      security: [{ BearerAuth: ["webhooks:write"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, description: "Public https endpoint" }
                events: { type: array, items: { $ref: "#/components/schemas/WebhookEvent" }, description: "Defaults to ['*'] (covers the 12 classic events only)" }
                description: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  url: { type: string }
                  events: { type: array, items: { $ref: "#/components/schemas/WebhookEvent" } }
                  active: { type: boolean }
                  secret: { type: string, description: "Returned ONCE at creation" }
                  secret_prefix: { type: string }
                  note: { type: string, description: "Present when '*' selected; lists new events not covered by '*'" }
        '422': { description: invalid_request or invalid_webhook (bad/private URL) }

  /webhooks/{id}:
    patch:
      summary: Update a webhook subscription
      tags: [Webhooks]
      operationId: updateWebhook
      security: [{ BearerAuth: ["webhooks:write"] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
                events: { type: array, items: { $ref: "#/components/schemas/WebhookEvent" } }
                active: { type: boolean }
                description: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookSubscription" }
        '404': { description: webhook_not_found }
        '422': { description: invalid_webhook }
    delete:
      summary: Delete a webhook subscription
      tags: [Webhooks]
      operationId: deleteWebhook
      security: [{ BearerAuth: ["webhooks:write"] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  deleted: { type: boolean }
                  id: { type: integer }
        '404': { description: webhook_not_found }

  /webhooks/{id}/test:
    post:
      summary: Send a test.ping delivery to a subscription
      tags: [Webhooks]
      operationId: testWebhook
      security: [{ BearerAuth: ["webhooks:write"] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  result: { type: string, example: delivered }
        '404': { description: webhook_not_found }

  /webhooks/{id}/rotate-secret:
    post:
      summary: Rotate the subscription secret in place (new secret returned once)
      description: |
        Subscription id, stats and history are kept. During grace_seconds the old secret is still sent
        as a second signature in the X-VeriMerkezi-Signature-256-Previous header.
      tags: [Webhooks]
      operationId: rotateWebhookSecret
      security: [{ BearerAuth: ["webhooks:write"] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                grace_seconds: { type: integer, minimum: 0, maximum: 604800, default: 86400 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: integer }
                  secret: { type: string, description: "Returned ONLY now - store securely" }
                  secret_prefix: { type: string }
                  previous_valid_until: { type: [string, "null"], description: "Old secret stays valid (second signature) until this time" }
        '400': { description: invalid_request }
        '404': { description: webhook_not_found }
        '422': { description: invalid_request (grace_seconds out of range) }

  /numbers/{phone_number_id}/history-import:
    get:
      summary: Coexistence history-import status
      tags: [Numbers]
      operationId: historyImportStatus
      security: [{ BearerAuth: ["profile:read"] }]
      parameters:
        - { name: phone_number_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: number_not_found }
    post:
      summary: Start history import manually (if auto-start was missed)
      tags: [Numbers]
      operationId: startHistoryImport
      security: [{ BearerAuth: ["profile:write"] }]
      parameters:
        - { name: phone_number_id, in: path, required: true, schema: { type: string } }
      responses:
        '202': { description: Requested }
        '409': { description: history_window_expired or already started }
        '422': { description: history_not_applicable }

  /numbers/{phone_number_id}/settings:
    patch:
      summary: Per-number automation / opt-out auto-reply toggle
      tags: [Numbers]
      operationId: numberSettings
      security: [{ BearerAuth: ["profile:write"] }]
      parameters:
        - { name: phone_number_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                automation_enabled: { type: boolean }
                opt_out_autoreply_enabled: { type: boolean }
      responses:
        '200': { description: OK }
        '404': { description: number_not_found }
        '422': { description: invalid_request }

  /numbers/{phone_number_id}/detach:
    post:
      summary: Detach the number from this account (stays registered in Meta/WABA); optional scheduled purge
      description: |
        Breaks only the Veri Merkezi link; the number stays registered in Meta and in the WABA (no deregister;
        deregister_meta=true -> 422 deregister_not_supported). purge_messages is REQUIRED.
        false: records are kept. true: message contents, media files/rows, conversations, flow sends, raw webhook
        logs of this number, call peer data, API log bodies and webhook delivery bodies are purged by a scheduled
        job within 24 hours - IRREVERSIBLE. Credit/billing rows, consent/opt-out evidence and counters are kept.
        Queued outbound messages are cancelled (error_code number_detached). Afterwards send/template/flow/call
        endpoints return 409 number_detached and inbound events are no longer forwarded. Events: number.detached,
        number.purged. Repeat call -> already=true, purge is not rescheduled. Re-connecting the number in the
        panel re-activates it (a not-yet-started purge is cancelled). Idempotency-Key supported. Live keys only.
      tags: [Numbers]
      operationId: detachNumber
      security: [{ BearerAuth: ["profile:write"] }]
      parameters:
        - { name: phone_number_id, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purge_messages]
              properties:
                purge_messages: { type: boolean, description: "true = scheduled purge within 24h (irreversible)" }
                reason: { type: string, maxLength: 100 }
                deregister_meta: { type: boolean, description: "Not supported in this version (true -> 422)" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  phone_number_id: { type: string }
                  detached_at: { type: string, format: date-time }
                  already: { type: boolean }
                  cancelled_outbound: { type: integer }
                  purge:
                    type: object
                    nullable: true
                    properties:
                      status: { type: string, enum: [scheduled, running, done] }
                      scheduled_at: { type: string, format: date-time }
                      due_by: { type: string, format: date-time }
                      done_at: { type: string, format: date-time }
        '403': { description: insufficient_scope or test_mode_unsupported }
        '404': { description: number_not_found }
        '409': { description: idempotency_in_progress }
        '422': { description: invalid_request (purge_messages / reason), deregister_not_supported, idempotency_key_conflict }

  /health:
    get:
      summary: Webhook delivery health (queue depth, p95 latency)
      tags: [Numbers]
      operationId: health
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: OK }

  /account/settings:
    patch:
      summary: Account-level settings (applied to all numbers + defaults for new numbers)
      tags: [Account]
      operationId: accountSettings
      security: [{ BearerAuth: ["profile:write"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              description: At least one field. All values must be JSON booleans.
              properties:
                revoke_edit_clean: { type: boolean, description: "Applied to ALL existing numbers" }
                automation_enabled: { type: boolean, description: "Applied to ALL existing numbers" }
                opt_out_autoreply_enabled: { type: boolean, description: "Always true since 2026-10-11 (opt-out confirmation reply is mandatory); false is ignored" }
                default_automation_enabled: { type: boolean, description: "Default for numbers connected later" }
                default_opt_out_autoreply_enabled: { type: boolean, description: "Always true (mandatory); false is ignored" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  numbers_updated: { type: integer }
                  numbers_total: { type: integer }
                  settings:
                    type: object
                    properties:
                      revoke_edit_clean: { type: boolean, description: "true when enabled on every number" }
                      automation_enabled: { type: boolean }
                      opt_out_autoreply_enabled: { type: boolean }
                      default_automation_enabled: { type: [boolean, "null"] }
                      default_opt_out_autoreply_enabled: { type: [boolean, "null"] }
        '403': { description: insufficient_scope }
        '422': { description: invalid_request (no field / non-boolean value) }

  /account/retention:
    patch:
      summary: KVKK data retention periods (days). Stored per account; currently enforced for call records only (message and media purge not yet active)
      tags: [Account]
      operationId: updateRetention
      security: [{ BearerAuth: ["profile:write"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                messages_days: { type: integer, minimum: 1, maximum: 3650 }
                media_days: { type: integer, minimum: 1, maximum: 3650 }
                webhook_deliveries_days: { type: integer, minimum: 1, maximum: 365 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  retention:
                    type: object
                    properties:
                      messages_days: { type: [integer, "null"] }
                      media_days: { type: [integer, "null"] }
                      webhook_deliveries_days: { type: [integer, "null"] }
                  note: { type: string }
        '403': { description: insufficient_scope }
        '422': { description: invalid_request (no field / out of range / not an integer) }

  /meta/disconnect-reasons:
    get:
      summary: Disconnect / restriction / re-auth reasons dictionary (since 2.31.0)
      tags: [Numbers]
      operationId: getDisconnectReasons
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  reconnect_url: { type: string }
                  reasons:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: PRIMARY_INACTIVITY }
                        source: { type: string, enum: [meta_disconnection_reason, meta_event, meta_ban_state, meta_restriction, vm_event] }
                        message_tr: { type: string }
                        action_tr: { type: [string, "null"] }
  /meta/error-codes:
    get:
      summary: Error codes dictionary - Meta and Veri Merkezi codes with Turkish text (since 2.32.0)
      tags: [Numbers]
      operationId: getErrorCodes
      parameters:
        - { name: source, in: query, required: false, schema: { type: string, enum: [meta_message, meta_template, meta_account, meta_call, vm] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  version: { type: string }
                  count: { type: integer }
                  codes:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, description: "Always a string (e.g. '131047', 'FIRST_PAUSE', 'insufficient_credits')" }
                        source: { type: string, enum: [meta_message, meta_template, meta_account, meta_call, vm] }
                        message_tr: { type: string }
                        action_tr: { type: [string, "null"] }
                        severity: { type: string, enum: [info, warn, error, critical] }
                        retryable: { type: boolean }
                        category: { type: [string, "null"], enum: [recipient, template, account, rate, payment, other, null] }
  /privacy/erasure:
    post:
      summary: KVKK erasure (right to be forgotten) for one end user; emits privacy.erasure_completed
      description: |
        Deletes messages, conversations, media, webhook delivery bodies and idempotency records for the
        given end user. Idempotent. Either wa_id or user_id is required.
      tags: [Account]
      operationId: privacyErasure
      security: [{ BearerAuth: ["profile:write"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wa_id: { type: string, description: "End-user phone (E.164 digits, 8-15)", example: "905550000000" }
                user_id: { type: string, description: "End-user BSUID (alternative to wa_id)" }
                phone_number_id: { type: string, description: "Optional; must belong to your account", example: "1234567890" }
                reference: { type: string, maxLength: 64, description: "Optional client reference (1-64 chars); echoed in the response and in privacy.erasure_completed (since 2.29.0)" }
      parameters:
        - { name: Idempotency-Key, in: header, required: false, description: "8-128 chars; a retry with the same key and body returns the first response (same erasure_id, Idempotent-Replay: true); erasure does not run twice (since 2.29.0)", schema: { type: string } }
      responses:
        '202':
          description: Completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: string, example: completed }
                  erasure_id: { type: string, example: "ers_0123456789abcdef01234567" }
                  phone_number_id: { type: [string, "null"] }
                  wa_id: { type: [string, "null"] }
                  user_id: { type: [string, "null"] }
                  reference: { type: [string, "null"], description: "since 2.29.0" }
                  completed_at: { type: string, format: date-time }
                  erased: { type: object, description: "Per-table deletion counts" }
        '403': { description: insufficient_scope }
        '404': { description: number_not_found }
        '409': { description: idempotency_in_progress }
        '422': { description: "invalid_request | idempotency_key_conflict" }
        '500': { description: erasure_failed }
        '503': { description: temporarily_unavailable (Retry-After) }

  /test/inbound:
    post:
      summary: "Sandbox: inject a synthetic inbound message (test keys only)"
      description: |
        Only with a vmk_test_ key. The synthetic message goes through the real inbound pipeline and
        signed message.received / message.revoked / message.edited events are delivered to your active
        webhook subscriptions. Nothing is sent to Meta. type app_contact_sync (2.23.0) sends a sample
        contact.synced event (add/update/remove); nothing is written to the address book.
      tags: [Messages]
      operationId: testInbound
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number_id]
              properties:
                phone_number_id: { type: string, example: "1234567890" }
                type: { type: string, enum: [text, revoke, edit, app_contact_sync], default: text }
                from: { type: string, description: "Sender phone, 8-15 digits", default: "905550000000" }
                text: { type: string, maxLength: 4096, description: "Required for text and edit" }
                original_message_id: { type: string, description: "Target message for revoke/edit" }
      responses:
        '202':
          description: Injected
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  mode: { type: string, example: test }
                  simulated: { type: boolean }
                  phone_number_id: { type: string }
                  injected: { type: object }
                  note: { type: string }
        '403': { description: test_only (live key) }
        '404': { description: number_not_found }
        '422': { description: invalid_request }
        '500': { description: test_inbound_failed }

  # ── Calling (WhatsApp Cloud API) — 2026-10-08. No credits charged; Meta bills business-initiated calls directly.
  /numbers/{phone_number_id}/calling:
    get:
      summary: Calling settings of a number
      tags: [Calling]
      operationId: getCallingSettings
      security: [{ BearerAuth: ["calls:read"] }]
      parameters:
        - { name: phone_number_id, in: path, required: true, schema: { type: string } }
        - { name: raw, in: query, required: false, schema: { type: boolean }, description: "Include Meta's raw calling object (SIP config stripped)" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallingSettings' }
        '404': { description: number_not_found }
    patch:
      summary: Update calling settings (only provided fields change)
      tags: [Calling]
      operationId: updateCallingSettings
      security: [{ BearerAuth: ["calls:write"] }]
      parameters:
        - { name: phone_number_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                callback_permission: { type: boolean }
                call_icon_visibility: { type: string, enum: [DEFAULT, DISABLE_ALL] }
                call_hours:
                  type: object
                  properties:
                    status: { type: string, enum: [ENABLED, DISABLED] }
                    timezone_id: { type: string, example: Europe/Istanbul }
                    weekly_operating_hours:
                      type: array
                      items:
                        type: object
                        properties:
                          day_of_week: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
                          open_time: { type: string, example: "0900" }
                          close_time: { type: string, example: "1800" }
                    holiday_schedule: { type: array, items: { type: object } }
      responses:
        '200': { description: Updated settings (includes eligibility) }
        '404': { description: number_not_found }
        '422': { description: "invalid_request / calling_not_supported_for_number / calling_messaging_limit_too_low / calling_prerequisites_unmet / calling_outbound_unavailable / calling_disabled_quality (error.eligibility included; coexistence or a messaging limit read from Meta below 2000 blocks enabled:true without changing Meta settings)" }

  /calls:
    get:
      summary: Call history (newest first)
      tags: [Calling]
      operationId: listCalls
      security: [{ BearerAuth: ["calls:read"] }]
      parameters:
        - { name: phone_number_id, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: peer, in: query, required: false, schema: { type: string }, description: "Other party's number" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  calls: { type: array, items: { $ref: '#/components/schemas/Call' } }
                  has_more: { type: boolean }
                  next_cursor: { type: [string, "null"] }
    post:
      summary: Start a business-initiated call (requires the user's call permission)
      tags: [Calling]
      operationId: startCall
      security: [{ BearerAuth: ["calls:write"] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number_id, to, sdp_offer]
              properties:
                phone_number_id: { type: string }
                to: { type: string, example: "905551234567" }
                sdp_offer: { type: string, description: "WebRTC SDP offer (RFC 8866)" }
                biz_opaque: { type: string, maxLength: 512 }
      responses:
        '201':
          description: Call initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  call_id: { type: string }
                  status: { type: string, example: initiated }
                  direction: { type: string, example: business_initiated }
        '403': { description: call_permission_required }
        '409': { description: calling_not_enabled / meta_outcome_unknown }
        '422': { description: invalid_sdp / invalid_phone / calling_not_available_in_country }

  /calls/{call_id}/pre_accept:
    post:
      summary: Pre-accept an incoming call (idempotent per call_id + action)
      tags: [Calling]
      operationId: preAcceptCall
      security: [{ BearerAuth: ["calls:write"] }]
      parameters:
        - { name: call_id, in: path, required: true, schema: { type: string }, description: "URL-encoded; if it contains '/', use '_' and send body.call_id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallAnswer' }
      responses:
        '200': { description: OK (a repeat returns the first result with Idempotent-Replay header) }
        '404': { description: call_not_found }
        '409': { description: call_ended / call_action_conflict / action_in_progress }

  /calls/{call_id}/accept:
    post:
      summary: Accept an incoming call
      tags: [Calling]
      operationId: acceptCall
      security: [{ BearerAuth: ["calls:write"] }]
      parameters:
        - { name: call_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallAnswer' }
      responses:
        '200': { description: OK }
        '404': { description: call_not_found }
        '409': { description: call_ended / call_action_conflict }

  /calls/{call_id}/reject:
    post:
      summary: Reject an incoming call
      tags: [Calling]
      operationId: rejectCall
      security: [{ BearerAuth: ["calls:write"] }]
      parameters:
        - { name: call_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: call_not_found }

  /calls/{call_id}/terminate:
    post:
      summary: Terminate a call (the only action for business-initiated calls)
      tags: [Calling]
      operationId: terminateCall
      security: [{ BearerAuth: ["calls:write"] }]
      parameters:
        - { name: call_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: call_not_found }

  /calls/permission-request:
    post:
      summary: Ask the user for call permission (interactive call_permission_request message)
      tags: [Calling]
      operationId: requestCallPermission
      security: [{ BearerAuth: ["calls:write"] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number_id, to]
              properties:
                phone_number_id: { type: string }
                to: { type: string }
                body: { type: string, maxLength: 1024 }
      responses:
        '201': { description: "Sent: { ok, message_id, to }" }
        '422': { description: outside_service_window / invalid_phone }
        '429': { description: permission_request_limited }

  /calls/permission:
    get:
      summary: Call permission status for a user
      tags: [Calling]
      operationId: getCallPermission
      security: [{ BearerAuth: ["calls:read"] }]
      parameters:
        - { name: phone_number_id, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: string, enum: [no_permission, temporary, permanent] }
                  expires_at: { type: [string, "null"], format: date-time }
                  can_request: { type: [boolean, "null"] }
                  can_call: { type: boolean }
                  actions: { type: array, items: { type: object } }
  /flows:
    get:
      summary: List WhatsApp Flows of the number's WABA
      tags: [Flows]
      operationId: listFlows
      security: [{ BearerAuth: ["flows:read"] }]
      parameters:
        - { name: phone_number_id, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, description: "1-200 (larger values are capped at 200; 2.25.0 and earlier: 100)", schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: after, in: query, required: false, description: "Cursor: next_cursor of the previous page", schema: { type: string } }
        - { name: cursor, in: query, required: false, description: "Alias of after (since 2.26.0)", schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  phone_number_id: { type: string }
                  waba_id: { type: string }
                  flows: { type: array, items: { $ref: '#/components/schemas/FlowListItem' } }
                  paging: { type: object, properties: { after: { type: [string, "null"] } } }
                  next_cursor: { type: [string, "null"], description: "Same as paging.after (since 2.26.0)" }
                  has_more: { type: boolean, description: "since 2.26.0" }
    post:
      summary: Create a Flow (with Flow JSON)
      description: Creates the Flow in DRAFT with the given Flow JSON. Meta validation errors are returned in validation_errors. No credit.
      tags: [Flows]
      operationId: createFlow
      security: [{ BearerAuth: ["flows:write"] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number_id, name, categories, flow_json]
              properties:
                phone_number_id: { type: string }
                name: { type: string, maxLength: 200 }
                categories: { type: array, minItems: 1, items: { type: string, enum: [SIGN_UP, SIGN_IN, APPOINTMENT_BOOKING, LEAD_GENERATION, CONTACT_US, CUSTOMER_SUPPORT, SURVEY, OTHER] } }
                flow_json: { oneOf: [ { type: object }, { type: string } ], description: "Flow JSON object or string (max 10 MB)" }
                endpoint_uri: { type: string, format: uri }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  flow_id: { type: string }
                  status: { type: string, enum: [DRAFT] }
                  validation_errors: { type: array, items: { type: object } }
                  hint: { type: string, enum: [flow_chained_equality, crm_update_required], description: "since 2.26.0; see FlowHint" }
                  hint_message: { type: string }
        '403': { description: "insufficient_scope / test_mode_unsupported" }
        '422': { description: "invalid_request / invalid_flow_json / meta_flow_failed" }
  /flows/{flow_id}:
    parameters:
      - { name: flow_id, in: path, required: true, schema: { type: string, pattern: "^[0-9]+$" } }
      - { name: phone_number_id, in: query, required: false, schema: { type: string }, description: "Needed only for Flows created outside this API (links the Flow to your account)" }
    get:
      summary: Flow details
      tags: [Flows]
      operationId: getFlow
      security: [{ BearerAuth: ["flows:read"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties: { ok: { type: boolean } }
                  - $ref: '#/components/schemas/Flow'
        '404': { description: flow_not_found }
    delete:
      summary: Delete a DRAFT Flow
      tags: [Flows]
      operationId: deleteFlow
      security: [{ BearerAuth: ["flows:write"] }]
      responses:
        '200': { description: "{ ok, flow_id, deleted: true }" }
        '409': { description: flow_not_draft }
  /flows/{flow_id}/json:
    put:
      summary: Replace the Flow JSON of a DRAFT Flow
      tags: [Flows]
      operationId: updateFlowJson
      security: [{ BearerAuth: ["flows:write"] }]
      parameters:
        - { name: flow_id, in: path, required: true, schema: { type: string } }
        - { name: phone_number_id, in: query, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flow_json]
              properties:
                flow_json: { oneOf: [ { type: object }, { type: string } ] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  flow_id: { type: string }
                  validation_errors: { type: array, items: { type: object } }
                  hint: { type: string, enum: [flow_chained_equality, crm_update_required], description: "since 2.26.0; see FlowHint" }
                  hint_message: { type: string }
        '409': { description: flow_not_draft }
  /flows/{flow_id}/publish:
    post:
      summary: Publish a Flow (irreversible)
      tags: [Flows]
      operationId: publishFlow
      security: [{ BearerAuth: ["flows:write"] }]
      parameters:
        - { name: flow_id, in: path, required: true, schema: { type: string } }
        - { name: phone_number_id, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: "{ ok, flow_id, status: PUBLISHED }" }
        '422': { description: "meta_flow_failed (error.hint / error.hint_message when the Flow JSON has chained equalities, since 2.26.0)" }
  /flows/{flow_id}/deprecate:
    post:
      summary: Deprecate a published Flow
      tags: [Flows]
      operationId: deprecateFlow
      security: [{ BearerAuth: ["flows:write"] }]
      parameters:
        - { name: flow_id, in: path, required: true, schema: { type: string } }
        - { name: phone_number_id, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: "{ ok, flow_id, status: DEPRECATED }" }
  /flows/{flow_id}/preview:
    get:
      summary: Flow preview URL
      tags: [Flows]
      operationId: getFlowPreview
      security: [{ BearerAuth: ["flows:read"] }]
      parameters:
        - { name: flow_id, in: path, required: true, schema: { type: string } }
        - { name: invalidate, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: phone_number_id, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  flow_id: { type: string }
                  preview_url: { type: [string, "null"] }
                  expires_at: { type: [string, "null"] }
  /flows/{flow_id}/metrics:
    get:
      summary: Flow endpoint metrics (Meta pass-through)
      tags: [Flows]
      operationId: getFlowMetrics
      security: [{ BearerAuth: ["flows:read"] }]
      parameters:
        - { name: flow_id, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date }, description: "Default: to - 6 days" }
        - { name: to, in: query, required: false, schema: { type: string, format: date }, description: "Default: today" }
        - { name: metric, in: query, required: false, schema: { type: string, enum: [ENDPOINT_REQUEST_COUNT, ENDPOINT_REQUEST_ERROR, ENDPOINT_REQUEST_ERROR_RATE, ENDPOINT_REQUEST_LATENCY_SECONDS_CEIL, ENDPOINT_AVAILABILITY], default: ENDPOINT_REQUEST_COUNT } }
        - { name: granularity, in: query, required: false, schema: { type: string, enum: [DAY, HOUR, LIFETIME], default: DAY } }
        - { name: phone_number_id, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  flow_id: { type: string }
                  from: { type: string }
                  to: { type: string }
                  metric: { type: [object, "null"], description: "Meta metric object (name, granularity, data_points) as-is" }
