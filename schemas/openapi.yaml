openapi: 3.1.0
info:
  title: VeriMerkezi WhatsApp API
  description: |
    Tech Provider REST API for sending WhatsApp Business Cloud messages,
    managing contacts, templates, and business profiles.

    Per-message credit model. Test mode keys (`vmk_test_...`) are free and never send to Meta
    (the returned wamid is a fake `test.<hex>` id).

    Test keys never change real data: every write endpoint is either simulated (`simulated: true`,
    `mode: "test"`) or returns 403 `test_mode_unsupported`; both carry the `X-Test-Mode: 1` header (since 2.22.0).

    Rate limits (since 2.27.0): per-key and per-account fixed one-minute windows per bucket (send, read, media, get, post, patch, put, delete).
    Account budget 300/min (media 150) shared by all keys; the linked service key (first party, e.g. Sigorta CRM) may use all of it,
    other keys share 40% when a first-party key exists. Headers: X-RateLimit-Limit/Remaining/Reset (key), X-RateLimit-Account-Limit/Remaining/Reset,
    X-RateLimit-Bucket; on 429: Retry-After, X-RateLimit-Scope (key | account | account_share), error.scope, error.bucket.
    Transient infrastructure errors return 503 temporarily_unavailable with Retry-After instead of 500.
    Since 2.28.0: at most 6 concurrent media downloads per account (first-party key all 6, other keys 2 combined);
    when full: 429 rate_limited, error.scope=concurrency, X-RateLimit-Scope: concurrency, X-Concurrency-Limit, Retry-After: 2.

    API version 2.32.1 (2026-10-25) - 68 endpoints (+ HEAD /media/{media_id}); docs, OpenAPI, SDKs and Postman share this version.
    Documentation: https://api.verimerkezi.app/referans/
  version: "2.33.0"
  contact:
    name: Veri Merkezi
    url: https://verimerkezi.app
    email: bilgi@verimerkezi.app
  license:
    name: Proprietary

servers:
  - url: https://api.verimerkezi.app/wa
    description: Production

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "vmk_live_xxx or vmk_test_xxx"
      description: API key - create one at panel/api.

  schemas:
    MediaRecord:
      type: object
      properties:
        media_id:      { type: integer, example: 13115 }
        client_id:     { type: integer, nullable: true }
        kind:          { type: string, enum: [image, video, document, audio, sticker] }
        source:        { type: string, enum: [inbound, outbound] }
        mime:          { type: string, example: image/jpeg }
        size:          { type: integer, example: 108919 }
        sha256:        { type: string, nullable: true }
        original_name: { type: string, nullable: true }
        created_at:    { type: string, example: "2026-09-19 20:14:58" }
        download_url:  { type: string, example: "https://api.verimerkezi.app/wa/media/13115" }
    Error:
      type: object
      properties:
        ok: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: insufficient_credits }
            message: { type: string }
            field: { type: string, nullable: true, description: "Template validation errors: path of the offending field, e.g. components[0].text (since 2.25.0)" }
            retryable: { type: boolean, description: "Meta-originated and call errors: whether retrying makes sense" }
            meta_code: { type: integer, description: "Meta error code (e.g. 131047 = outside 24h window). Since 2.32.0 present on every Meta-originated error; 0 = could not reach Meta" }
            message_tr: { type: string, description: "Short Turkish explanation from the error dictionary (since 2.32.0, all errors)" }
            action_tr: { type: [string, "null"], description: "Turkish next step (since 2.32.0)" }
            severity: { type: string, enum: [info, warn, error, critical], description: "When the code is in the dictionary (since 2.32.0)" }
            category: { type: string, enum: [recipient, template, account, rate, payment, other], description: "Meta-originated errors (since 2.32.0)" }
            meta_message_tr: { type: [string, "null"], description: "Call and Flow errors: Turkish meaning of meta_code (since 2.32.0)" }
            meta_subcode: { type: [string, integer, "null"], description: "Meta error subcode; returned as text on template endpoints (since 2.25.0)" }
            meta_message: { type: string, maxLength: 300, description: "Meta's raw (usually English) text, incl. connection errors. error.message is always Turkish since 2.32.0" }
            meta_user_title: { type: string, description: "Template endpoints: Meta's user-facing title (since 2.25.0)" }
            meta_user_message: { type: string, description: "Template endpoints: Meta's user-facing message (since 2.25.0)" }
            fbtrace_id: { type: string, description: "Template endpoints: Meta trace id (since 2.25.0)" }
            hint: { type: string, enum: [flow_chained_equality, crm_update_required], description: "Flows meta_flow_failed: Meta rejected the Flow JSON with 'Type mismatch in an equality operation' (more than one equality in one expression). crm_update_required when the key belongs to a Sigorta CRM service (since 2.26.0)" }
            hint_message: { type: string, description: "Turkish explanation for hint (since 2.26.0)" }
            next_edit_at: { type: string, format: date-time, description: "template_edit_limit: earliest time the template can be edited again" }
            template_id: { type: integer, description: "template_exists: id of the existing template" }
            status: { type: string, description: "template_not_editable: current template status" }
            required_scope: { type: string, description: "insufficient_scope (single scope)" }
            required_scopes: { type: array, items: { type: string }, description: "insufficient_scope where any one of several scopes is enough" }
            phone_number_id: { type: string, description: "number_detached" }
            detached_at: { type: string, format: date-time, description: "number_detached" }
            max_bytes: { type: integer, description: "media_too_large (POST /media, POST /templates/media)" }
            type: { type: string, description: "media_too_large: detected media type" }
            balance: { type: integer, description: "insufficient_credits" }
            retry_after: { type: integer, description: "Seconds to wait (also Retry-After header)" }
            base_url: { type: string, description: "endpoint_moved" }
            docs: { type: string, description: "endpoint_moved" }

    Contact:
      type: object
      properties:
        id: { type: integer }
        phone: { type: string, example: "+905551234567" }
        name: { type: string }
        email: { type: string, nullable: true }
        company: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        source: { type: string }
        opted_out: { type: boolean }
        opted_out_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    CallingSettings:
      type: object
      properties:
        ok: { type: boolean }
        phone_number_id: { type: string }
        enabled: { type: boolean }
        callback_permission: { type: [boolean, "null"] }
        call_icon_visibility: { type: [string, "null"] }
        call_hours: { type: [object, "null"] }
        messaging_limit_tier: { type: [string, "null"] }
        messaging_limit_ok: { type: [boolean, "null"], description: "Calling requires a messaging limit of at least 2000" }
        raw: { type: object }
        eligibility: { $ref: '#/components/schemas/CallingEligibility' }
    CallingEligibility:
      type: object
      description: "Calling eligibility from stored number data (messaging limit is read from Meta once only when the stored tier is below 2000). ok/eligible_*: true = ok, false = blocked, null = unknown. Also returned in error bodies of GET/PATCH /numbers/{id}/calling."
      properties:
        eligible_inbound: { type: [boolean, "null"], description: "Customers can call this number" }
        eligible_outbound: { type: [boolean, "null"], description: "Business can call customers (business-initiated)" }
        checks:
          type: array
          items:
            type: object
            properties:
              key: { type: string, enum: [cloud_api_only, messaging_limit, calls_webhook, payment_method, country] }
              ok: { type: [boolean, "null"] }
              applies_to: { type: array, items: { type: string, enum: [inbound, outbound] } }
              title_tr: { type: string }
              detail_tr: { type: string }
              how_to_fix_tr: { type: [string, "null"] }
    Call:
      type: object
      properties:
        call_id: { type: string }
        phone_number_id: { type: string }
        direction: { type: string, enum: [user_initiated, business_initiated] }
        from: { type: [string, "null"] }
        to: { type: [string, "null"] }
        status: { type: string, enum: [initiated, ringing, pre_accepted, accepted, terminating, rejected, missed, failed, completed] }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        duration_sec: { type: [integer, "null"] }
        billable_pulses: { type: [integer, "null"], description: "ceil(duration/6), business-initiated only; informational (Meta bills directly)" }
        last_action: { type: [string, "null"] }
        errors: { type: [array, "null"] }
        is_test: { type: boolean }
        created_at: { type: string, format: date-time }
    CallAnswer:
      type: object
      required: [sdp_answer]
      properties:
        sdp_answer: { type: string, description: "WebRTC SDP answer (RFC 8866)" }
        call_id: { type: string, description: "Only when the path segment is '_'" }

    Flow:
      type: object
      properties:
        flow_id: { type: string }
        name: { type: [string, "null"] }
        status: { type: [string, "null"], enum: [DRAFT, PUBLISHED, DEPRECATED, BLOCKED, THROTTLED, null] }
        categories: { type: array, items: { type: string, enum: [SIGN_UP, SIGN_IN, APPOINTMENT_BOOKING, LEAD_GENERATION, CONTACT_US, CUSTOMER_SUPPORT, SURVEY, OTHER] } }
        validation_errors: { type: array, items: { type: object }, description: "Meta Flow JSON validation errors (as returned by Meta)" }
        health_status: { type: [object, "null"], description: "Meta health_status (can_send_message, entities) when available" }
        json_version: { type: [string, "null"] }
        data_api_version: { type: [string, "null"] }
        endpoint_uri: { type: [string, "null"] }
    FlowListItem:
      allOf:
        - { $ref: '#/components/schemas/Flow' }
        - type: object
          properties:
            id: { type: string, description: "Same as flow_id (since 2.26.0)" }
            waba_id: { type: string, description: "since 2.26.0" }
            phone_number_id: { type: [string, "null"], description: "The number the list was requested for (since 2.26.0)" }
            updated_at: { type: [string, "null"], format: date-time, description: "Last change observed in the Veri Merkezi record (Meta has no Flow modification time); null if not recorded (since 2.26.0)" }
    FlowHint:
      type: object
      description: "Present only when Meta's validation_errors contain 'Type mismatch in an equality operation' (since 2.26.0). Flow JSON is never modified."
      properties:
        hint: { type: string, enum: [flow_chained_equality, crm_update_required] }
        hint_message: { type: string }
    FlowMessage:
      type: object
      description: "Interactive WhatsApp Flow message (type=flow). Exactly one of flow_id / flow_name."
      required: [cta, body]
      properties:
        flow_id: { type: string }
        flow_name: { type: string }
        flow_token: { type: string, maxLength: 191, description: "Your correlation token; generated (vmf_...) when omitted and echoed in flow.completed" }
        cta: { type: string, maxLength: 20, description: "Button text, no emoji" }
        body: { type: string, maxLength: 1024 }
        header: { type: string, maxLength: 60 }
        footer: { type: string, maxLength: 60 }
        mode: { type: string, enum: [published, draft], default: published }
        action: { type: string, enum: [navigate, data_exchange], default: navigate }
        screen: { type: string, description: "Entry screen id (required for navigate)" }
        data: { type: object, description: "Initial screen data (navigate only)" }

    LocationMessage:
      type: object
      description: "Location message (type=location). Free-form: 24h window, 1 credit. Invalid -> 422 invalid_location (since 2.21.0)."
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90, example: 41.0082 }
        longitude: { type: number, minimum: -180, maximum: 180, example: 28.9784 }
        name: { type: string, maxLength: 1000, example: "Merkez Ofis" }
        address: { type: string, maxLength: 1000, example: "Ornek Mah. Ornek Cad. No:1, Istanbul" }

    ContactsMessage:
      type: array
      description: "Contact cards (type=contacts), Meta format. 1-20 cards; name.formatted_name required; unknown fields are dropped. Invalid -> 422 invalid_contacts (since 2.21.0)."
      minItems: 1
      maxItems: 20
      items:
        type: object
        required: [name]
        properties:
          name:
            type: object
            required: [formatted_name]
            properties:
              formatted_name: { type: string, maxLength: 1000 }
              first_name: { type: string }
              last_name: { type: string }
              middle_name: { type: string }
              prefix: { type: string }
              suffix: { type: string }
          phones:
            type: array
            items:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "+905550000000" }
                type: { type: string, example: WORK }
                wa_id: { type: string, pattern: '^[0-9]{6,20}$', example: "905550000000", description: "If set, recipient sees Message / Save contact buttons" }
          emails:
            type: array
            items:
              type: object
              required: [email]
              properties:
                email: { type: string }
                type: { type: string }
          urls:
            type: array
            items:
              type: object
              required: [url]
              properties:
                url: { type: string }
                type: { type: string }
          org:
            type: object
            properties:
              company: { type: string }
              department: { type: string }
              title: { type: string }
          addresses:
            type: array
            items:
              type: object
              properties:
                street: { type: string }
                city: { type: string }
                state: { type: string }
                zip: { type: string }
                country: { type: string }
                country_code: { type: string }
                type: { type: string }
          birthday: { type: string, format: date, example: "1990-01-31" }

    Template:
      type: object
      properties:
        id: { type: integer }
        meta_template_id: { type: string, nullable: true }
        name: { type: string }
        language: { type: string, example: tr }
        category: { type: string, enum: [MARKETING, UTILITY, AUTHENTICATION] }
        previous_category: { type: string, nullable: true, description: "Category before Meta changed it (since 2.25.0)" }
        parameter_format: { type: string, enum: [POSITIONAL, NAMED], description: "Variable format; fixed at creation (since 2.25.0)" }
        status: { type: string, enum: [DRAFT, PENDING, APPROVED, REJECTED, PAUSED, DISABLED] }
        components: { type: array, items: { type: object } }
        rejected_reason: { type: string, nullable: true, description: "Raw Meta reason (INVALID_FORMAT, ABUSIVE_CONTENT, ...); meaningful only when REJECTED" }
        rejected_reason_text: { type: string, nullable: true, description: "Turkish explanation; only when REJECTED (since 2.25.0)" }
        quality_score: { type: string, nullable: true, description: "Also returned in the list since 2.25.0" }
        waba_id: { type: string, nullable: true }
        phone_number_id: { type: string, nullable: true }
        created_at: { type: string, nullable: true }
        submitted_at: { type: string, nullable: true }
        status_updated_at: { type: string, nullable: true }
        header_media_ref: { type: [integer, "null"], description: "Detail only: VM copy of the header media (since 2.25.0)" }
        header_media: { $ref: "#/components/schemas/TemplateHeaderMedia" }
        edit_limit:
          type: object
          description: "Detail only (since 2.25.0). Counts edits made through Veri Merkezi only."
          properties:
            editable: { type: boolean }
            edits_last_30d: { type: integer }
            max_edits_30d: { type: integer, example: 10 }
            next_edit_at: { type: [string, "null"], format: date-time }

    TemplateHeaderMedia:
      type: [object, "null"]
      description: |
        List and detail (since 2.25.0). null when the template has no IMAGE/VIDEO/DOCUMENT header. With a VM copy:
        permanent public link + file info (temporary=false). Without a copy: Meta's short-lived approval sample
        (temporary=true, only url and format). When a media-header template is sent with POST /messages without a
        `header` component, the permanent link is added automatically.
      properties:
        url: { type: string, format: uri }
        mime_type: { type: [string, "null"], example: image/jpeg }
        file_size: { type: [integer, "null"] }
        sha256: { type: [string, "null"] }
        filename: { type: [string, "null"] }
        format: { type: string, enum: [IMAGE, VIDEO, DOCUMENT] }
        temporary: { type: boolean }

    TemplateMediaUploadResponse:
      type: object
      description: "POST /templates/media response (201, since 2.25.0). Test keys: header_handle '4::test...', header_media_ref null, simulated true."
      properties:
        ok: { type: boolean }
        header_handle: { type: string, example: "4::aW1hZ2UvanBlZw==:ARb..." , description: "Short-lived; use it as HEADER example.header_handle[0] right away" }
        header_media_ref: { type: [integer, "null"], example: 8812 }
        format: { type: string, enum: [IMAGE, VIDEO, DOCUMENT] }
        mime_type: { type: [string, "null"], example: image/jpeg }
        file_size: { type: [integer, "null"] }
        waba_id: { type: string }
        simulated: { type: boolean }

    TemplateDeleteResponse:
      type: object
      description: "DELETE /templates/{id} (single language) or DELETE /templates?name= (all languages) response"
      properties:
        ok: { type: boolean }
        deleted: { type: boolean }
        id: { type: integer, description: "DELETE /templates/{id}" }
        name: { type: string }
        language: { type: string, description: "DELETE /templates/{id}" }
        waba_id: { type: string, description: "DELETE /templates?name=" }
        ids: { type: array, items: { type: integer }, description: "DELETE /templates?name=" }
        languages: { type: array, items: { type: string }, description: "DELETE /templates?name=" }
        meta_missing: { type: boolean, description: "Already gone at Meta; local rows deleted anyway" }

    TemplateUpdateRequest:
      type: object
      description: "PATCH|POST /templates/{id} body. components is the FULL list (required unless only the category changes)."
      properties:
        components: { type: array, items: { type: object } }
        category: { type: string, enum: [MARKETING, UTILITY, AUTHENTICATION], description: "Only REJECTED/PAUSED templates; APPROVED -> 422 category_not_editable" }
        message_send_ttl_seconds: { type: integer }
        header_media_ref: { type: integer, description: "Omit to regenerate the handle from the existing VM copy" }
        header_media_url: { type: string, format: uri }
        allow_category_change: { type: boolean }
        cta_url_link_tracking_opted_out: { type: boolean }
        optout_footer: { type: boolean }

    InteractiveHeader:
      type: object
      description: "Optional header. text (<=60) or image/video/document by https link or Meta media id (list: text only)."
      required: [type]
      properties:
        type: { type: string, enum: [text, image, video, document] }
        text: { type: string, maxLength: 60 }
        image: { type: object, properties: { link: { type: string, format: uri }, id: { type: string } } }
        video: { type: object, properties: { link: { type: string, format: uri }, id: { type: string } } }
        document: { type: object, properties: { link: { type: string, format: uri }, id: { type: string }, filename: { type: string } } }

    InteractiveButtonsMessage:
      type: object
      description: "Reply buttons (interactive.type=button), Meta format. 1-3 buttons; title <=20 (unique), id <=256 (unique). Since 2.22.0. https://developers.facebook.com/docs/whatsapp/cloud-api/messages/interactive-reply-buttons-messages"
      required: [type, body, action]
      properties:
        type: { type: string, enum: [button] }
        header: { $ref: "#/components/schemas/InteractiveHeader" }
        body: { type: object, required: [text], properties: { text: { type: string, maxLength: 1024 } } }
        footer: { type: object, properties: { text: { type: string, maxLength: 60 } } }
        action:
          type: object
          required: [buttons]
          properties:
            buttons:
              type: array
              minItems: 1
              maxItems: 3
              items:
                type: object
                required: [type, reply]
                properties:
                  type: { type: string, enum: [reply] }
                  reply:
                    type: object
                    required: [id, title]
                    properties:
                      id: { type: string, maxLength: 256, example: onay }
                      title: { type: string, maxLength: 20, example: "Onaylıyorum" }

    InteractiveListMessage:
      type: object
      description: "List (interactive.type=list), Meta format. 1-10 sections, 1-10 rows in total; row id <=200 (unique), title <=24, description <=72; section title <=24 (required with >1 section). Since 2.22.0. https://developers.facebook.com/docs/whatsapp/cloud-api/messages/interactive-list-messages"
      required: [type, body, action]
      properties:
        type: { type: string, enum: [list] }
        header: { type: object, required: [type, text], properties: { type: { type: string, enum: [text] }, text: { type: string, maxLength: 60 } } }
        body: { type: object, required: [text], properties: { text: { type: string, maxLength: 4096 } } }
        footer: { type: object, properties: { text: { type: string, maxLength: 60 } } }
        action:
          type: object
          required: [button, sections]
          properties:
            button: { type: string, maxLength: 20, example: "Şube seç" }
            sections:
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: object
                required: [rows]
                properties:
                  title: { type: string, maxLength: 24 }
                  rows:
                    type: array
                    minItems: 1
                    maxItems: 10
                    items:
                      type: object
                      required: [id, title]
                      properties:
                        id: { type: string, maxLength: 200 }
                        title: { type: string, maxLength: 24 }
                        description: { type: string, maxLength: 72 }

    CtaUrlMessage:
      type: object
      description: "Call-to-action URL button (interactive.type=cta_url), Meta format. Taps do not produce webhook events. Since 2.22.0. https://developers.facebook.com/docs/whatsapp/cloud-api/messages/interactive-cta-url-messages"
      required: [type, body, action]
      properties:
        type: { type: string, enum: [cta_url] }
        header: { $ref: "#/components/schemas/InteractiveHeader" }
        body: { type: object, required: [text], properties: { text: { type: string, maxLength: 1024 } } }
        footer: { type: object, properties: { text: { type: string, maxLength: 60 } } }
        action:
          type: object
          required: [parameters]
          properties:
            name: { type: string, enum: [cta_url] }
            parameters:
              type: object
              required: [display_text, url]
              properties:
                display_text: { type: string, maxLength: 20, example: "Kargo takibi" }
                url: { type: string, format: uri, maxLength: 2000, pattern: '^https?://', example: "https://example.com/takip?no=12345" }

    LocationRequestMessage:
      type: object
      description: "Location request (interactive.type=location_request_message), Meta format. Body only (no header/footer). The user's reply arrives as message.received type=location with context.message_id = this message. Since 2.22.0. https://developers.facebook.com/documentation/business-messaging/whatsapp/messages/location-request-messages/"
      required: [type, body]
      properties:
        type: { type: string, enum: [location_request_message] }
        body: { type: object, required: [text], properties: { text: { type: string, maxLength: 1024 } } }
        action: { type: object, properties: { name: { type: string, enum: [send_location] } } }

    InboundInteractive:
      type: [object, "null"]
      description: "data.interactive in message.received / message.echo (type=interactive messages only; otherwise null). reply_* since 2.22.0 (additive)."
      properties:
        type: { type: string, example: list_reply, description: "button_reply | list_reply | nfm_reply | ..." }
        name: { type: [string, "null"], description: "nfm_reply.name (\"flow\" for form replies)" }
        reply_id: { type: [string, "null"], description: "Selected button/row id (button_reply, list_reply)" }
        reply_title: { type: [string, "null"] }
        reply_description: { type: [string, "null"], description: "list_reply only" }

    InboundUnsupported:
      type: [object, "null"]
      description: "data.unsupported in message.received when type=unsupported (since 2.24.0, additive); otherwise null. Meta did not deliver the content; reason from errors[0]."
      properties:
        type: { type: [string, "null"], example: unknown, description: "Meta unsupported.type" }
        raw_type: { type: [string, "null"], example: unknown }
        error_code: { type: [integer, "null"], example: 131060 }
        error_title: { type: [string, "null"], example: "This message is unavailable." }

    InboundReferral:
      type: [object, "null"]
      description: >
        data.referral in message.received / GET /messages (since 2.33.0, additive). Present on the FIRST
        inbound message when the customer tapped a Click-to-WhatsApp (CTWA) ad or a Facebook/Instagram post;
        otherwise null. Also returned for past messages via GET /messages when stored. Meta object, field
        names unchanged. Match ad clicks with ctwa_clid; ad/post id is source_id.
      properties:
        source_url: { type: [string, "null"], example: "https://fb.me/2abcDEF" }
        source_id: { type: [string, "null"], example: "120210000000000000", description: "Ad or post id" }
        source_type: { type: [string, "null"], example: ad, description: "ad | post" }
        headline: { type: [string, "null"], example: "Kasko teklifinizi 2 dakikada alın" }
        body: { type: [string, "null"], example: "Hemen WhatsApp'tan yazın" }
        media_type: { type: [string, "null"], example: image, description: "image | video" }
        image_url: { type: [string, "null"] }
        video_url: { type: [string, "null"] }
        thumbnail_url: { type: [string, "null"] }
        ctwa_clid: { type: [string, "null"], example: "ARAbcd1234...", description: "Click-to-WhatsApp click id" }
        welcome_message: { type: [object, "null"], description: "Ad greeting payload when present" }

    WebhookEvent:
      type: string
      description: |
        46 events. A '*' subscription covers ONLY the 12 classic events (message.received ..
        account.alert). The other 23 (message.revoked/edited/history/sent, number.status_changed,
        number.name_changed, credit.low/exhausted, privacy.erasure_completed, contact.opt_out_changed,
        template.category_changed/quality_changed, template.disabled/reinstated, call.connect/status/terminate/permission_reply,
        flow.completed, flow.status_changed, number.detached, number.purged, contact.synced; since 2.32.0
        message.status.deleted, number.limit_changed, account.review_changed, template.pending/in_appeal/locked/
        archived/unarchived/deleted/pending_deletion/limit_exceeded)
        must be selected explicitly.
      enum:
        - "*"
        - "message.received"
        - "message.echo"
        - "message.status.sent"
        - "message.status.delivered"
        - "message.status.read"
        - "message.status.failed"
        - "template.approved"
        - "template.rejected"
        - "template.flagged"
        - "template.paused"
        - "quality.changed"
        - "account.alert"
        - "message.revoked"
        - "message.edited"
        - "message.history"
        - "message.sent"
        - "number.status_changed"
        - "credit.low"
        - "credit.exhausted"
        - "privacy.erasure_completed"
        - "contact.opt_out_changed"
        - "template.category_changed"
        - "template.quality_changed"
        - "template.disabled"
        - "template.reinstated"
        - "number.name_changed"
        - "call.connect"
        - "call.status"
        - "call.terminate"
        - "call.permission_reply"
        - "flow.completed"
        - "flow.status_changed"
        - "number.detached"
        - "number.purged"
        - "contact.synced"
        - "message.status.deleted"
        - "number.limit_changed"
        - "account.review_changed"
        - "template.pending"
        - "template.in_appeal"
        - "template.locked"
        - "template.archived"
        - "template.unarchived"
        - "template.deleted"
        - "template.pending_deletion"
        - "template.limit_exceeded"

    AppContact:
      type: object
      description: |
        WhatsApp Business app address book entry of a coexistence number (2.23.0). Separate from the panel
        address book (/contacts). Source: Meta webhook field smb_app_state_sync
        (https://developers.facebook.com/docs/whatsapp/cloud-api/webhooks/reference/smb_app_state_sync).
      properties:
        id: { type: integer, description: "Our id (unique per number + phone); equals contact.synced changes[].id" }
        phone_number_id: { type: string }
        phone: { type: [string, "null"], example: "+905551112233", description: "E.164 with +" }
        wa_id: { type: [string, "null"], example: "905551112233", description: "Derived from phone (Meta does not send wa_id)" }
        user_id: { type: [string, "null"], description: "BSUID (business-scoped user id) when Meta sends it" }
        full_name: { type: [string, "null"], description: "null for removed entries" }
        first_name: { type: [string, "null"] }
        source: { type: string, enum: [app_sync, app_initial_sync, app_backfill], description: "Origin of the latest change" }
        updated_at: { type: string, format: date-time }
        removed_at: { type: [string, "null"], format: date-time }

    AppContactSyncStatus:
      type: object
      properties:
        ok: { type: boolean }
        phone_number_id: { type: string }
        coexistence: { type: boolean }
        sync_supported: { type: boolean }
        reason: { type: [string, "null"], enum: [not_coexistence, number_detached, null] }
        initial_sync:
          type: object
          properties:
            status: { type: string, enum: [not_requested, requested, in_progress, completed, expired, failed] }
            requested_at: { type: [string, "null"], format: date-time }
            completed_at: { type: [string, "null"], format: date-time }
        last_event_at: { type: [string, "null"], format: date-time }
        contact_count: { type: integer }
        removed_count: { type: integer }

    ContactSyncedEventData:
      type: object
      description: "data of the contact.synced webhook event (max 100 changes per event)"
      properties:
        phone_number_id: { type: string }
        sync_type: { type: string, enum: [initial, incremental] }
        batch:
          type: object
          properties:
            index: { type: integer }
            count: { type: integer }
        changes:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              action: { type: string, enum: [add, update, remove] }
              id: { type: integer }
              phone: { type: [string, "null"] }
              wa_id: { type: [string, "null"] }
              user_id: { type: [string, "null"] }
              full_name: { type: [string, "null"], description: "null on remove" }
              first_name: { type: [string, "null"], description: "null on remove" }
              changed_at: { type: string, format: date-time }

    WebhookSubscription:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, nullable: true }
        url: { type: string, format: uri }
        events: { type: array, items: { $ref: "#/components/schemas/WebhookEvent" } }
        active: { type: boolean }
        secret_prefix: { type: string, nullable: true }
        last_success_at: { type: string, nullable: true }
        last_failure_at: { type: string, nullable: true }
        failure_count: { type: integer }
        created_at: { type: string, nullable: true }

    Number:
      type: object
      properties:
        id: { type: integer }
        waba_id: { type: string }
        phone_number_id: { type: string }
        display_phone_number: { type: string }
        verified_name: { type: string }
        quality_rating: { type: string, enum: [GREEN, YELLOW, RED, UNKNOWN] }
        status: { type: string }
        connection_type: { type: string, enum: [standard, coexistence] }
        disconnected_at: { type: [string, "null"] }
        disconnect_reason: { type: [string, "null"], description: "Meta disconnection_info.reason, e.g. PRIMARY_INACTIVITY; only when status is not active (since 2.30.0)" }
        disconnect_initiated_by: { type: [string, "null"], description: "e.g. SYSTEM, USER; only when status is not active (since 2.30.0)" }
        reauth_required: { type: boolean, description: "Meta permission lost; reconnect the number in the panel (since 2.30.0)" }
        reauth_required_at: { type: [string, "null"], description: "since 2.30.0" }
        disconnect_message_tr: { type: [string, "null"], description: "Short Turkish reason from the disconnect reasons dictionary (since 2.31.0)" }
        disconnect_action_tr: { type: [string, "null"], description: "Turkish next step for the customer (since 2.31.0)" }
        reconnect_url: { type: [string, "null"], description: "Panel page to reconnect the number, when reconnection is needed (since 2.31.0)" }
        payment_method_status: { type: string, enum: [ok, missing, unknown], description: "Meta payment method of the WABA (the WABA owner pays Meta) (since 2.32.0)" }
        payment_method_action_tr: { type: [string, "null"], description: "Turkish next step when missing (since 2.32.0)" }

  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string }
      description: Replays cached response for duplicate requests (24h TTL).

paths:
  /me:
    get:
      summary: Account info and credit balance
      tags: [Account]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  user: { type: object }
                  api_key: { type: object }
                  credits:
                    type: object
                    properties:
                      balance: { type: integer }
                      packages: { type: array, items: { type: object } }

  /numbers:
    get:
      summary: List connected WhatsApp numbers
      tags: [Numbers]
      security: [{ BearerAuth: ["profile:read"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  numbers:
                    type: array
                    items: { $ref: "#/components/schemas/Number" }

  /messages:
    post:
      summary: Send a message (template, text, media, reaction, flow, location, contacts, interactive)
      description: |
        Live mode consumes 1 credit. Test mode is free.
        Media (image/video/audio/document) is free-form and only deliverable within the 24h customer service window; otherwise use a template. 1 credit. Provide media by public https `link` (or Meta media `id`). Limits: image ≤5MB, video ≤16MB, audio ≤16MB, document ≤100MB.
        Location (`type: location` + `location`) and contact cards (`type: contacts` + `contacts`) are free-form messages too (24h window, 1 credit; since 2.21.0).
        Interactive messages (`type: interactive` + `interactive`, since 2.22.0): reply buttons (`button`), list (`list`),
        CTA URL button (`cta_url`) and location request (`location_request_message`), Meta format. Free-form (24h window;
        outside it Meta 131047 -> 422 meta_send_failed and the credit is refunded), 1 credit. Invalid -> 422 invalid_interactive
        with `field`. The customer's choice arrives in message.received as `data.interactive` (see InboundInteractive) and `data.button`.
      tags: [Messages]
      security: [{ BearerAuth: ["messages:send"] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number_id, to]
              properties:
                phone_number_id: { type: string }
                to: { type: string, example: "905551234567" }
                type:
                  type: string
                  enum: [image, video, audio, document, sticker, reaction, flow, location, contacts, interactive]
                  description: "Media type for a free-form media message, `reaction`, `flow` for a WhatsApp Flow message (see `flow`), `location` (see `location`), `contacts` (see `contacts`, since 2.21.0) or `interactive` (see `interactive`, since 2.22.0)."
                template:
                  type: object
                  properties:
                    name: { type: string }
                    language: { type: string, example: tr }
                    otp:
                      type: string
                      example: "482913"
                      description: >-
                        Convenience field for AUTHENTICATION (OTP) templates. When set, the body and the
                        copy-code OTP button components are built automatically per Meta's rules
                        (ignored if `components` is provided).
                    components:
                      type: array
                      description: >-
                        Meta template component objects. Add a `body` component for body variables and,
                        for a dynamic URL button, a `button` component:
                        `{ "type": "button", "sub_type": "url", "index": 0, "parameters": [{ "type": "text", "text": "..." }] }`
                        — its parameters[0].text fills the trailing `{{1}}` of the template URL button
                        (one variable, at the end of the URL; API send only). `index` may be a number or a string ("0").
                        Do NOT send a button component for a fixed-URL button (Meta rejects it with the 132000/131008 family).
                        Since 2.25.0, for templates registered at VM (except AUTHENTICATION) the components are checked
                        against the stored definition: mismatch -> 422 invalid_template_parameters (field e.g.
                        template.components[0].parameters / template.components[0].index / template.components);
                        unregistered templates are passed through unchanged. Media-header templates: when no `header`
                        component is sent, the stored header media is added automatically with its permanent link
                        (GET /templates -> header_media.url); a `header` you send is used as is.
                        For a FLOW button: `{ "type": "button", "sub_type": "flow", "index": 0, "parameters": [{ "type": "action", "flow_token": "...", "flow_action_data": {} }] }`
                        (Meta's native `{ "type": "action", "action": { ... } }` is also accepted).
                      items: { type: object }
                text:
                  description: >-
                    Plain text body, as a string or as an object `{ "body": "..." }` (the `body` value is used).
                    A non-string body returns 422 invalid_request (field "text").
                    Only within the 24h customer service window.
                  oneOf:
                    - { type: string }
                    - type: object
                      properties:
                        body: { type: string }
                        preview_url: { type: boolean }
                      required: [body]
                flow:
                  $ref: '#/components/schemas/FlowMessage'
                location:
                  $ref: '#/components/schemas/LocationMessage'
                contacts:
                  $ref: '#/components/schemas/ContactsMessage'
                interactive:
                  description: "Interactive message (type=interactive, since 2.22.0). For a WhatsApp Flow use type=flow."
                  oneOf:
                    - $ref: '#/components/schemas/InteractiveButtonsMessage'
                    - $ref: '#/components/schemas/InteractiveListMessage'
                    - $ref: '#/components/schemas/CtaUrlMessage'
                    - $ref: '#/components/schemas/LocationRequestMessage'
                  discriminator:
                    propertyName: type
                    mapping:
                      button: '#/components/schemas/InteractiveButtonsMessage'
                      list: '#/components/schemas/InteractiveListMessage'
                      cta_url: '#/components/schemas/CtaUrlMessage'
                      location_request_message: '#/components/schemas/LocationRequestMessage'
                recipient: { type: string, description: "BSUID recipient instead of `to` (aliases recipient_id / bsuid)" }
                context:
                  type: object
                  properties:
                    message_id: { type: string, description: "wamid to quote" }
                biz_opaque_callback_data: { type: string, maxLength: 512, description: "Echoed in message.status.*; defaults to Idempotency-Key" }
                image:
                  type: object
                  description: "Image media. Provide a public https link (or Meta media id)."
                  properties:
                    link: { type: string, format: uri, example: "https://example.com/photo.jpg" }
                    caption: { type: string }
                video:
                  type: object
                  description: "Video media. Provide a public https link (or Meta media id)."
                  properties:
                    link: { type: string, format: uri, example: "https://example.com/video.mp4" }
                    caption: { type: string }
                audio:
                  type: object
                  description: "Audio media. Provide a public https link (or Meta media id)."
                  properties:
                    link: { type: string, format: uri, example: "https://example.com/audio.mp3" }
                    id: { type: string, description: "Meta media id (from POST /media)." }
                    voice:
                      type: boolean
                      description: >-
                        Send as a WhatsApp voice note (OGG/Opus only, preferably mono). If omitted, set
                        automatically to true when the media is audio/ogg on Meta or the link ends with
                        .ogg/.opus. Non-boolean value -> 422 invalid_media (field "audio.voice").
                document:
                  type: object
                  description: "Document media. Provide a public https link (or Meta media id)."
                  properties:
                    link: { type: string, format: uri, example: "https://example.com/file.pdf" }
                    caption: { type: string }
                    filename: { type: string, example: "fatura.pdf" }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: integer }
                  wamid: { type: string }
                  to: { type: string }
                  type: { type: string, enum: [template, text, image, video, audio, document, flow, location, contacts] }
                  status: { type: string, example: sent }
                  mode: { type: string, enum: [live, test] }
                  simulated: { type: boolean }
                  credits_used: { type: integer }
                  balance: { type: integer }
        '402':
          description: Insufficient credits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        '404':
          description: Number not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        '422':
          description: Validation or Meta error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }


    get:
      summary: Reconciliation - list message records (recover missed webhooks)
      description: Read-only; does not consume credit or the send rate bucket. Ascending by time, cursor paginated.
      tags: [Messages]
      operationId: listMessages
      security: [{ BearerAuth: ["messages:read"] }, { BearerAuth: ["inbox:read"] }]
      parameters:
        - { name: phone_number_id, in: query, required: true, schema: { type: string } }
        - { name: since, in: query, schema: { type: string }, description: "ISO 8601, up to 90 days back" }
        - { name: cursor, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: OK }
        '404': { description: number_not_found }
        '422': { description: invalid_since or missing phone_number_id }
  /messages/read:
    post:
      summary: Mark an incoming message as read + optional typing indicator
      description: "Marks the incoming message as read (blue tick). typing:true shows a ~25s 'typing…' indicator. No credit."
      tags: [Messages]
      security: [{ BearerAuth: ["messages:send"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number_id, message_id]
              properties:
                phone_number_id: { type: string }
                message_id: { type: string }
                typing: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  marked_read: { type: boolean }
                  typing: { type: boolean }

  /contacts:
    get:
      summary: List contacts (cursor pagination)
      tags: [Contacts]
      security: [{ BearerAuth: ["contacts:read"] }]
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: opted_out
          description: Filter by opt-out state (optional).
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  contacts:
                    type: array
                    items: { $ref: "#/components/schemas/Contact" }
                  next_cursor: { type: string, nullable: true }
                  has_more: { type: boolean }
    post:
      summary: Create a single contact
      tags: [Contacts]
      security: [{ BearerAuth: ["contacts:write"] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, name]
              properties:
                phone: { type: string }
                name: { type: string }
                country_code: { type: string, default: "90" }
                email: { type: string }
                company: { type: string }
                tags: { type: array, items: { type: string } }
      responses:
        '201': { description: Created }
        '409':
          description: Duplicate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /contacts/opted-out:
    get:
      summary: List contacts who opted out (cursor pagination)
      description: >-
        Contacts whose opted_out flag is true, ordered by id desc. Use `since` for incremental sync
        together with the `contact.opt_out_changed` webhook event. Added in 2.16.0.
      tags: [Contacts]
      security: [{ BearerAuth: ["contacts:read"] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - in: query
          name: cursor
          description: Opaque cursor (same format as /contacts).
          schema: { type: string }
        - in: query
          name: since
          description: ISO 8601; only contacts with opted_out_at >= since.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  contacts:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        phone: { type: string, example: "+905551234567" }
                        name: { type: string, nullable: true }
                        opted_out: { type: boolean }
                        opted_out_at: { type: string, format: date-time, nullable: true }
                        reason: { type: string, nullable: true }
                  next_cursor: { type: string, nullable: true }
                  has_more: { type: boolean }
        '401': { description: Invalid or missing API key }
        '403': { description: "Missing contacts:read scope" }
        '422':
          description: Invalid `since` (error.field = "since")
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        '429': { description: Rate limited }

  /app-contacts:
    get:
      summary: List WhatsApp Business app address book entries (coexistence)
      description: >-
        Address book of the WhatsApp Business app on the phone of coexistence numbers (2.23.0). Separate from
        the panel address book (/contacts). Ordered by updated_at desc, id desc. Full pull once, then listen to
        contact.synced; recover missed events with updated_since + include_removed=true. Test keys return 3 fixed
        sample rows (simulated: true). No credits charged.
      tags: [Contacts]
      operationId: listAppContacts
      security: [{ BearerAuth: ["contacts:read"] }]
      parameters:
        - in: query
          name: phone_number_id
          description: Only this number's address book (default all numbers of the account).
          schema: { type: string }
        - in: query
          name: updated_since
          description: ISO 8601; only entries with updated_at >= updated_since.
          schema: { type: string, format: date-time }
        - in: query
          name: include_removed
          schema: { type: boolean, default: false }
        - in: query
          name: limit
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - in: query
          name: cursor
          description: Opaque cursor (next_cursor of the previous page).
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  app_contacts: { type: array, items: { $ref: "#/components/schemas/AppContact" } }
                  next_cursor: { type: [string, "null"] }
                  has_more: { type: boolean }
        '401': { description: Invalid or missing API key }
        '403': { description: "Missing contacts:read scope" }
        '404': { description: number_not_found }
        '422':
          description: Invalid updated_since / limit / cursor / phone_number_id (error.field)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        '429': { description: Rate limited }

  /numbers/{phone_number_id}/app-contacts/sync:
    get:
      summary: App address book sync status (coexistence)
      description: >-
        Meta delivers the initial address book only within 24 hours after onboarding and only once
        (https://developers.facebook.com/docs/whatsapp/embedded-signup/custom-flows/onboarding-business-app-users);
        Veri Merkezi requests it automatically on connect. There is no re-sync endpoint; later changes arrive by
        themselves. Older numbers report initial_sync.status = expired.
      tags: [Numbers]
      operationId: getAppContactsSyncStatus
      security: [{ BearerAuth: ["contacts:read"] }]
      parameters:
        - { name: phone_number_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppContactSyncStatus" }
        '403': { description: "Missing contacts:read scope" }
        '404': { description: number_not_found }
        '422': { description: invalid_request }

  /contacts/bulk:
    post:
      summary: Bulk insert contacts (max 1000)
      tags: [Contacts]
      security: [{ BearerAuth: ["contacts:write"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contacts]
              properties:
                contacts:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    properties:
                      phone: { type: string }
                      name: { type: string }
                      email: { type: string }
                      company: { type: string }
                      tags: { type: array, items: { type: string } }
                skip_duplicates: { type: boolean, default: true }
                country_code: { type: string, default: "90" }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  inserted: { type: integer }
                  skipped: { type: integer }
                  errors: { type: array, items: { type: object } }

  /templates:
    get:
      summary: List templates (filterable, cursor-paginated)
      tags: [Templates]
      operationId: listTemplates
      security: [{ BearerAuth: ["templates:read"] }]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [DRAFT, PENDING, APPROVED, REJECTED, PAUSED, DISABLED] } }
        - { name: category, in: query, required: false, schema: { type: string, enum: [MARKETING, UTILITY, AUTHENTICATION] } }
        - { name: language, in: query, required: false, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string }, description: "Search in template name" }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50 } }
        - { name: refresh, in: query, required: false, schema: { type: boolean }, description: "1/true → sync from Meta before reading (same 1/min per WABA limit as POST /templates/sync; when limited returns cached list with refreshed=false)" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items: { $ref: "#/components/schemas/Template" }
                  has_more: { type: boolean }
                  next_cursor: { type: string, nullable: true }
    post:
      summary: Create a template and submit it to Meta
      tags: [Templates]
      operationId: createTemplate
      security: [{ BearerAuth: ["templates:write"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, language, category, components]
              properties:
                waba_id: { type: string, description: "Target WABA (waba_id or phone_number_id required)" }
                phone_number_id: { type: string, description: "Alternative to waba_id; WABA resolved from the number" }
                name: { type: string }
                language: { type: string, example: tr }
                category: { type: string, enum: [MARKETING, UTILITY, AUTHENTICATION] }
                parameter_format: { type: string, enum: [POSITIONAL, NAMED], default: POSITIONAL, description: "NAMED uses {{ad_soyad}}-style variables with example.*_named_params (since 2.25.0)" }
                allow_category_change: { type: boolean, description: "Passed to Meta as is" }
                message_send_ttl_seconds: { type: integer, minimum: -1, maximum: 2592000, description: "Passed to Meta as is (since 2.25.0)" }
                cta_url_link_tracking_opted_out: { type: boolean, description: "Passed to Meta as is (since 2.25.0)" }
                header_media_ref: { type: integer, description: "From POST /templates/media; for IMAGE/VIDEO/DOCUMENT headers one of example.header_handle, header_media_ref or header_media_url is required (since 2.25.0)" }
                header_media_url: { type: string, format: uri, description: "Legacy: public https URL for an IMAGE/VIDEO/DOCUMENT header; downloaded and uploaded to Meta as header_handle" }
                optout_footer: { type: boolean, description: "MARKETING only; default true adds the standard opt-out footer" }
                components:
                  type: array
                  items: { type: object }
                  description: |
                    Meta components. HEADER: TEXT (<=60 chars, at most 1 variable + example), IMAGE/VIDEO/DOCUMENT
                    (example.header_handle), LOCATION. BODY (<=1024). FOOTER (<=60). BUTTONS (<=10): QUICK_REPLY, URL
                    (<=2), PHONE_NUMBER, COPY_CODE (<=1, example <=20 chars), FLOW, OTP. Variable examples:
                    POSITIONAL -> example.body_text / header_text; NAMED -> example.body_text_named_params /
                    header_text_named_params [{param_name, example}].
      responses:
        '202':
          description: Accepted (status PENDING; Meta may answer APPROVED/REJECTED immediately). Test keys - simulated, id 0.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        '404': { description: number_not_found }
        '409':
          description: template_exists (same name + language in this WABA; error.field=name, error.template_id)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        '422':
          description: invalid_request / template_invalid (error.field = field path) or template_rejected (Meta, error.meta_*)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        '502': { description: "meta_unavailable (Meta unreachable or 5xx)" }
    delete:
      summary: Delete a template by name (ALL languages)
      description: |
        Deletes every language of `name` in the WABA (since 2.25.0). Use DELETE /templates/{id} for a single
        language. A deleted approved template's name cannot be reused for 30 days; DISABLED templates cannot be
        deleted. Test keys: simulated (404 template_not_found if no local row has that name).
      tags: [Templates]
      operationId: deleteTemplatesByName
      security: [{ BearerAuth: ["templates:write"] }]
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: waba_id, in: query, required: false, schema: { type: string }, description: "Required when the account has several WABAs" }
        - { name: phone_number_id, in: query, required: false, schema: { type: string }, description: "Alternative to waba_id" }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDeleteResponse" }
        '404': { description: "template_not_found / number_not_found" }
        '422':
          description: invalid_request / waba_required / template_delete_failed (error.meta_*)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        '502': { description: meta_unavailable }

  /templates/media:
    post:
      summary: Upload a template header sample (returns header_handle)
      description: |
        Since 2.25.0. Uploads the sample file for an IMAGE/VIDEO/DOCUMENT header to Meta's Resumable Upload.
        Put `header_handle` into the HEADER component's `example.header_handle[0]` and `header_media_ref` at the
        top level of POST /templates. Three inputs (use one): multipart `file`, JSON `url` (public https) or JSON
        `media_id` (uploaded with POST /media, 30 days valid; the server re-downloads and re-uploads it).
        Accepted: IMAGE image/jpeg, image/png <=5 MB; VIDEO video/mp4 <=16 MB; DOCUMENT application/pdf <=100 MB.
        Test keys: nothing is sent to Meta or stored (header_handle `4::test...`, header_media_ref null,
        simulated true); multipart type/size checks still apply, url/media_id are not downloaded.
        https://developers.facebook.com/docs/graph-api/guides/upload
      tags: [Templates]
      operationId: uploadTemplateMedia
      security: [{ BearerAuth: ["templates:write"] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                format: { type: string, enum: [IMAGE, VIDEO, DOCUMENT], description: "Inferred from the file type when omitted" }
                waba_id: { type: string }
                phone_number_id: { type: string }
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri, example: "https://cdn.example.com/kampanya.jpg" }
                media_id: { type: string, example: "1234567890", description: "Meta media id from POST /media (send phone_number_id too)" }
                format: { type: string, enum: [IMAGE, VIDEO, DOCUMENT] }
                waba_id: { type: string }
                phone_number_id: { type: string }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateMediaUploadResponse" }
        '404': { description: number_not_found }
        '413': { description: "media_too_large (error.max_bytes)" }
        '415': { description: "media_invalid_format" }
        '422':
          description: invalid_request / waba_required / header_media_fetch_failed / meta_upload_failed (error.meta_*)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        '502': { description: meta_unavailable }

  /templates/validate:
    post:
      summary: Validate template components without sending to Meta
      tags: [Templates]
      operationId: validateTemplate
      security: [{ BearerAuth: ["templates:read"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [components]
              properties:
                waba_id: { type: string }
                phone_number_id: { type: string }
                name: { type: string }
                language: { type: string }
                category: { type: string, enum: [MARKETING, UTILITY, AUTHENTICATION] }
                parameter_format: { type: string, enum: [POSITIONAL, NAMED] }
                header_media_ref: { type: integer, description: "Optional; without a media source a placeholder is used for validation" }
                components: { type: array, items: { type: object } }
      responses:
        '200':
          description: valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  valid: { type: boolean }
                  message: { type: string }
        '422':
          description: template_invalid (error.field = path of the offending field, since 2.25.0)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /templates/sync:
    post:
      summary: Sync templates from Meta now (1 call per minute per WABA)
      tags: [Templates]
      operationId: syncTemplates
      security: [{ BearerAuth: ["templates:read"] }, { BearerAuth: ["templates:write"] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                phone_number_id: { type: string, description: "Only sync this number's WABA; omit for all active WABAs" }
      responses:
        '200':
          description: synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  synced: { type: object, additionalProperties: { type: integer }, description: "waba_id → templates processed" }
                  templates_changed: { type: integer }
                  at: { type: string, format: date-time }
                  rate_limited: { type: object, additionalProperties: { type: integer }, description: "Partial: skipped waba_id → retry_after seconds" }
                  errors: { type: object, additionalProperties: { type: string } }
        '404': { description: number_not_found }
        '429': { description: "sync_rate_limited (error.retry_after seconds, Retry-After header)" }
        '502': { description: sync_failed }

  /templates/{id}:
    get:
      summary: Template detail (adds header_media_ref and edit_limit)
      tags: [Templates]
      operationId: getTemplate
      security: [{ BearerAuth: ["templates:read"] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        '404': { description: template_not_found }
    patch:
      summary: Edit a template (re-submits, status PENDING)
      description: |
        Only APPROVED, REJECTED or PAUSED templates (else 409 template_not_editable). Approved: 1 edit per 24 h and
        10 per 30 days, category cannot change (422 category_not_editable); rejected/paused: unlimited, category may
        change. The edit replaces ALL components (send the full list). name, language and parameter_format cannot be
        changed (422 invalid_request). Equivalent: POST /templates/{id}. Test keys: validated and simulated
        (status PENDING, nothing stored). https://developers.facebook.com/documentation/business-messaging/whatsapp/templates/template-management
      tags: [Templates]
      operationId: updateTemplate
      security: [{ BearerAuth: ["templates:write"] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateUpdateRequest" }
      responses:
        '200':
          description: OK (status PENDING)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        '404': { description: template_not_found }
        '409':
          description: template_not_editable (error.status)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        '422':
          description: invalid_request / category_not_editable / template_invalid (error.field) / template_edit_failed (error.meta_*)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        '429':
          description: template_edit_limit (error.next_edit_at, error.retry_after, Retry-After header; error.meta_* when Meta enforced it)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        '502': { description: meta_unavailable }
    post:
      summary: Edit a template (POST alias of PATCH)
      description: Same behaviour, body and responses as PATCH /templates/{id} (since 2.25.0).
      tags: [Templates]
      operationId: updateTemplatePost
      security: [{ BearerAuth: ["templates:write"] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateUpdateRequest" }
      responses:
        '200':
          description: OK (status PENDING)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        '404': { description: template_not_found }
        '409': { description: template_not_editable }
        '422': { description: "invalid_request / category_not_editable / template_invalid / template_edit_failed" }
        '429': { description: template_edit_limit }
        '502': { description: meta_unavailable }
    delete:
      summary: Delete a template (this language only)
      description: |
        Since 2.25.0 only the language of this row is deleted (Meta: name + hsm_id); previously Meta deleted every
        language of the name. Use DELETE /templates?name= for all languages. Never-submitted drafts are deleted
        locally only. If already gone at Meta, the local row is deleted and `meta_missing: true` is returned.
      tags: [Templates]
      operationId: deleteTemplate
      security: [{ BearerAuth: ["templates:write"] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDeleteResponse" }
        '404': { description: template_not_found }
        '422':
          description: template_delete_failed (error.meta_*; e.g. DISABLED cannot be deleted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        '502': { description: meta_unavailable }

  /templates/{id}/copy:
    post:
      summary: Copy a template under a new name and/or language
      description: |
        Since 2.25.0. Uses the source's components, parameter_format and header media (when the VM copy exists);
        `components` overrides them (e.g. a translation). The footer is copied as is (optout_footer defaults to
        false). Missing VM copy of a media header -> 422 invalid_request field=header_media_ref (upload with
        POST /templates/media first). Response and errors as POST /templates. Test keys: 202, id 0.
      tags: [Templates]
      operationId: copyTemplate
      security: [{ BearerAuth: ["templates:write"] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                language: { type: string, example: en_US }
                category: { type: string, enum: [MARKETING, UTILITY, AUTHENTICATION] }
                waba_id: { type: string }
                components: { type: array, items: { type: object } }
                optout_footer: { type: boolean }
                header_media_ref: { type: integer }
                allow_category_change: { type: boolean }
                message_send_ttl_seconds: { type: integer }
                cta_url_link_tracking_opted_out: { type: boolean }
      responses:
        '202':
          description: Accepted (status PENDING)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        '404': { description: template_not_found }
        '409': { description: template_exists }
        '422': { description: "invalid_request / template_invalid / template_rejected" }
        '502': { description: meta_unavailable }

  /profile/{phone_number_id}:
    get:
      summary: Read WhatsApp Business Profile
      tags: [Profile]
      security: [{ BearerAuth: ["profile:read"] }]
      parameters:
        - in: path
          name: phone_number_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404':
          description: Number not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      summary: Update WhatsApp Business Profile
      tags: [Profile]
      security: [{ BearerAuth: ["profile:write"] }]
      parameters:
        - in: path
          name: phone_number_id
          required: true
          schema: { type: string }
